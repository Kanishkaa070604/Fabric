<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">B-DIAL How apps dial</title>
  <desc id="desc">Dial names and ports: Customer to Platform via connect-agent Service; Platform to Customer via privacy.tenant.connect.abluva.com; same-cluster plain K8s DNS; Hybrid vs SaaS-hosted host on registration.</desc>

  <style>
    .title { font: 600 20px Inter, -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #FFFFFF; letter-spacing: -0.02em; }
    .subtitle { font: 400 12px Inter, system-ui, sans-serif; fill: rgba(255,255,255,0.88); }
    .zone { font: 600 11px Inter, system-ui, sans-serif; fill: #667085; letter-spacing: 0.08em; text-transform: uppercase; }
    .cardTitle { font: 600 13px Inter, system-ui, sans-serif; fill: #344054; }
    .cardBody { font: 400 11px Inter, system-ui, sans-serif; fill: #667085; }
    .mono { font: 500 10px ui-monospace, 'SF Mono', Menlo, monospace; fill: #344054; }
    .monoSm { font: 500 9px ui-monospace, 'SF Mono', Menlo, monospace; fill: #344054; }
    .th { font: 600 11px Inter, system-ui, sans-serif; fill: #344054; }
    .footer { font: 400 10px Inter, system-ui, sans-serif; fill: #667085; }
    .brandHdr { font: 600 11px Inter, system-ui, sans-serif; fill: #FFFFFF; letter-spacing: 0.06em; text-transform: uppercase; }
    .pathLbl { font: 600 10px Inter, system-ui, sans-serif; fill: #674EA7; }
  </style>

  <defs>
    <marker id="arrowBrand" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#674EA7"/>
    </marker>
    <clipPath id="clipTable"><rect x="48" y="80" width="1504" height="280" rx="12"/></clipPath>
    <clipPath id="clipTopo"><rect x="48" y="384" width="1504" height="440" rx="12"/></clipPath>
    <clipPath id="clipNlb1"><rect x="568" y="480" width="180" height="72" rx="6"/></clipPath>
    <clipPath id="clipNlb2"><rect x="1040" y="480" width="220" height="72" rx="6"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#FCFCFD"/>

  <rect x="0" y="0" width="1600" height="56" fill="#674EA7"/>
  <text x="48" y="26" class="title">B-DIAL &#183; How apps dial</text>
  <text x="48" y="44" class="subtitle">What URL / host:port to put in config &#183; zero mesh SDK &#183; protocol unchanged</text>
  <text x="1552" y="34" text-anchor="end" class="subtitle">abluva.com</text>

  <!-- Dial table -->
  <g clip-path="url(#clipTable)">
    <rect x="48" y="80" width="1504" height="280" rx="12" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.5"/>
  </g>
  <text x="64" y="108" class="zone">Dial catalog &#183; put this in app config</text>

  <!-- header row -->
  <rect x="64" y="124" width="1472" height="36" rx="6" fill="#EDE8F5" stroke="#B4A7D6"/>
  <text x="80" y="146" class="th">Direction</text>
  <text x="280" y="146" class="th">App dials</text>
  <text x="780" y="146" class="th">Resolves / lands</text>
  <text x="1180" y="146" class="th">Notes</text>

  <!-- row 1 -->
  <rect x="64" y="168" width="1472" height="44" rx="4" fill="#FFFFFF"/>
  <text x="80" y="186" class="cardTitle">Customer &#8594; Platform</text>
  <text x="80" y="202" class="cardBody">A2 / B3</text>
  <text x="280" y="194" class="mono">connect-agent.&lt;ns&gt;.svc:&lt;port&gt;</text>
  <text x="780" y="194" class="cardBody">Local Agent listener &#8594; tunnel &#8594; Gateway</text>
  <text x="1180" y="194" class="cardBody">ns usually fabric-edge</text>

  <!-- row 2 -->
  <rect x="64" y="212" width="1472" height="44" rx="4" fill="#FCFCFD"/>
  <text x="80" y="230" class="cardTitle">Platform &#8594; Customer</text>
  <text x="80" y="246" class="cardBody">A3 / B4</text>
  <text x="280" y="238" class="mono">privacy.&lt;tenant_id&gt;.connect.abluva.com:8444</text>
  <text x="780" y="238" class="cardBody">Shared inbound VIP &#183; SNI = routing key</text>
  <text x="1180" y="238" class="cardBody">Or &lt;reg&gt;.&lt;tenant&gt;.&#8230;</text>

  <!-- row 3 -->
  <rect x="64" y="256" width="1472" height="44" rx="4" fill="#FFFFFF"/>
  <text x="80" y="274" class="cardTitle">Same-cluster Platform</text>
  <text x="80" y="290" class="cardBody">A1 / B1</text>
  <text x="280" y="282" class="mono">&lt;svc&gt;.&lt;saas-ns&gt;.svc:&lt;port&gt;</text>
  <text x="780" y="282" class="cardBody">Plain K8s DNS + ztunnel</text>
  <text x="1180" y="282" class="cardBody">No Gateway / Agent</text>

  <!-- row 4 -->
  <rect x="64" y="300" width="1472" height="40" rx="4" fill="#FCFCFD"/>
  <text x="80" y="318" class="cardTitle">Agent &#8594; Gateway</text>
  <text x="80" y="334" class="cardBody">tunnel</text>
  <text x="280" y="326" class="mono">fabric.abluva.com:8443</text>
  <text x="780" y="326" class="cardBody">Mesh NLB &#183; Ghostunnel mTLS</text>
  <text x="1180" y="326" class="cardBody">Agent only, not apps</text>

  <!-- Small topology -->
  <g clip-path="url(#clipTopo)">
    <rect x="48" y="384" width="1504" height="440" rx="12" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.5"/>
  </g>
  <text x="64" y="412" class="zone">Tiny topology &#183; two common dials</text>

  <!-- Left: Customer to Platform -->
  <rect x="72" y="432" width="700" height="280" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
  <text x="88" y="456" class="cardTitle">Customer &#8594; Platform (A2 / B3)</text>

  <rect x="96" y="480" width="160" height="72" rx="6" fill="#FFFFFF" stroke="#D0D5DD"/>
  <text x="112" y="508" class="cardTitle">Customer app</text>
  <text x="112" y="528" class="cardBody">orders / CRM</text>

  <rect x="312" y="480" width="200" height="72" rx="6" fill="#FFFFFF" stroke="#674EA7"/>
  <rect x="312" y="480" width="200" height="22" rx="6" fill="#674EA7"/>
  <text x="328" y="496" class="brandHdr">fabric-edge</text>
  <text x="328" y="524" class="cardTitle">Connect Agent</text>
  <text x="328" y="540" class="monoSm">connect-agent.svc:port</text>

  <g clip-path="url(#clipNlb1)">
    <rect x="568" y="480" width="180" height="72" rx="6" fill="#FFFFFF" stroke="#674EA7"/>
    <rect x="568" y="480" width="32" height="32" fill="none" stroke="#D0D5DD" stroke-width="1"/>
    <image href="icons/NetworkLoadBalancerLB.svg" x="568" y="480" width="32" height="32" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="612" y="500" class="cardTitle">Mesh NLB</text>
  <text x="584" y="528" class="monoSm">fabric:8443</text>
  <text x="584" y="544" class="cardBody">&#8594; Gateway</text>

  <path d="M256 516 H304" fill="none" stroke="#674EA7" stroke-width="1.5" marker-end="url(#arrowBrand)"/>
  <path d="M512 516 H560" fill="none" stroke="#674EA7" stroke-width="1.5" marker-end="url(#arrowBrand)"/>

  <text x="96" y="588" class="cardBody">Only change in app config:</text>
  <text x="96" y="612" class="mono">DATABASE_URL=...@connect-agent.fabric-edge.svc:9443/...</text>
  <text x="96" y="644" class="cardBody">Registration host/port = Platform target (DIRECT_ENDPOINT)</text>
  <text x="96" y="668" class="cardBody">Protocol (Postgres / HTTP / gRPC) flows unmodified</text>
  <text x="96" y="692" class="cardBody">Hybrid: destination stays on Platform; Agent on customer</text>

  <!-- Right: Platform to Customer -->
  <rect x="800" y="432" width="728" height="280" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
  <text x="816" y="456" class="cardTitle">Platform &#8594; Customer (A3 / B4)</text>

  <rect x="824" y="480" width="160" height="72" rx="6" fill="#FFFFFF" stroke="#B4A7D6"/>
  <text x="840" y="508" class="cardTitle">discovery</text>
  <text x="840" y="528" class="cardBody">SaaS API</text>

  <g clip-path="url(#clipNlb2)">
    <rect x="1040" y="480" width="220" height="72" rx="6" fill="#FFFFFF" stroke="#674EA7"/>
    <rect x="1040" y="480" width="32" height="32" fill="none" stroke="#D0D5DD" stroke-width="1"/>
    <image href="icons/NetworkLoadBalancerLB.svg" x="1040" y="480" width="32" height="32" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="1084" y="500" class="cardTitle">Inbound :8444</text>
  <text x="1056" y="528" class="monoSm">SNI multiplex</text>
  <text x="1056" y="544" class="cardBody">&#8594; Gateway authz</text>

  <rect x="1320" y="480" width="184" height="72" rx="6" fill="#FFFFFF" stroke="#674EA7"/>
  <rect x="1320" y="480" width="184" height="22" rx="6" fill="#674EA7"/>
  <text x="1336" y="496" class="brandHdr">fabric-edge</text>
  <text x="1336" y="524" class="cardTitle">Agent &#8594; app</text>
  <text x="1336" y="540" class="monoSm">host on registration</text>

  <path d="M984 516 H1032" fill="none" stroke="#674EA7" stroke-width="1.5" marker-end="url(#arrowBrand)"/>
  <path d="M1260 516 H1312" fill="none" stroke="#674EA7" stroke-width="1.5" marker-end="url(#arrowBrand)"/>

  <text x="824" y="588" class="cardBody">SaaS config (no mesh SDK):</text>
  <text x="824" y="612" class="mono">orders_url: https://privacy.&lt;tenant&gt;.connect.abluva.com/</text>
  <text x="824" y="644" class="cardBody">DNS reconciler emits name while registration Active</text>
  <text x="824" y="668" class="cardBody">UUID form: &lt;reg_id&gt;.&lt;tenant_id&gt;.connect.abluva.com</text>
  <text x="824" y="692" class="cardBody">Friendly slug: privacy.&lt;tenant_id&gt;.connect.abluva.com</text>

  <!-- Hybrid vs SaaS-hosted callout -->
  <rect x="72" y="728" width="1456" height="72" rx="8" fill="#EDE8F5" stroke="#B4A7D6" stroke-width="1.5"/>
  <text x="88" y="752" class="cardTitle">Registration destination host &#8212; who dials after StreamOpen yes</text>
  <text x="88" y="774" class="cardBody">A2/B3 (Customer&#8594;Platform): host/port = Platform target; Gateway dials it (DIRECT_ENDPOINT). A3/B4 (Platform&#8594;Customer): Agent dials customer host after AgentDial (CONNECT_AGENT).</text>
  <text x="88" y="792" class="cardBody">Hybrid: apps + Agent on customer. SaaS-hosted: apps may land in Platform tenant-*; dial names above stay the same &#8212; only registration host/port bookkeeping changes.</text>

  <text x="48" y="880" class="footer">Apps dial hostnames; mesh is invisible at the protocol layer &#183; Agent dials fabric.abluva.com; apps never do &#183; Icons: OCI Designer Toolkit</text>
</svg>
