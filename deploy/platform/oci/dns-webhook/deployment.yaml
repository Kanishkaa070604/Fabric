# OCI DNS webhook receiver — runs in the Platform cluster alongside the
# control-plane. Receives DNS upsert/delete POSTs from the CP reconciler
# and translates them into OCI DNS Zone API calls.
#
# Prerequisites:
#   1. OCI DNS Zone created (connect.abluva.com for this env).
#   2. OKE workers instance principal: dynamic-group + manage dns-records.
#   3. Secret fabric-dns-webhook-token already from setup-day0.sh — do NOT
#      re-apply a dummy token Secret (that would rotate the CP shared secret).
#
# Wire the CP (when you deploy it):
#   FABRIC_DNS_PROVIDER=webhook
#   FABRIC_DNS_WEBHOOK_URL=http://fabric-dns-webhook.3407e407-792a-452d-8bb4-03c54ac34d52-5620f907-0281-497d-9098-8c.svc:8090
#   FABRIC_DNS_WEBHOOK_TOKEN from Secret fabric-dns-webhook-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-dns-webhook
  namespace: 3407e407-792a-452d-8bb4-03c54ac34d52-5620f907-0281-497d-9098-8c
  labels:
    app: fabric-dns-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabric-dns-webhook
  template:
    metadata:
      labels:
        app: fabric-dns-webhook
    spec:
      # Instance principal needs IMDS (169.254.169.254); pod network often cannot
      # reach it on this OKE — hostNetwork is required for OCI_AUTH_MODE=instance_principal.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: default
      imagePullSecrets:
        - name: ocir-secret
      containers:
        - name: dns-webhook
          image: phx.ocir.io/axsfgj15p1je/fabric-dns-webhook:v1
          ports:
            - containerPort: 8090
          env:
            - name: OCI_DNS_ZONE_ID
              value: "ocid1.dns-zone.oc1..aaaaaaaalwopebd3cccnln7j3o6rn4pokxo2xle7ylr7jyqxlkys7pzi7s4q"
            - name: OCI_DNS_COMPARTMENT_ID
              value: "ocid1.tenancy.oc1..aaaaaaaazrqdvyighgi6vt34gjvgur7dylkhwisomxehsy3hhprr5omslmaq"
            - name: OCI_AUTH_MODE
              value: "instance_principal"
            - name: OCI_DNS_RECORD_TTL
              value: "60"
            - name: WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fabric-dns-webhook-token
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 30
          resources:
            requests: { cpu: "25m", memory: "128Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: fabric-dns-webhook
  namespace: 3407e407-792a-452d-8bb4-03c54ac34d52-5620f907-0281-497d-9098-8c
spec:
  selector:
    app: fabric-dns-webhook
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
